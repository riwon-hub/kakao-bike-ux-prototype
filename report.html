<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사용 분석 리포트 · 카카오 T 바이크 프로토타입</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#17181c;--muted:#6b7280;--line:#e5e7eb;--accent:#5b3df5;--ok:#16a34a;--dead:#e11d48;--back:#f59e0b;--blocked:#0ea5e9;--disabled:#9ca3af}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
header{padding:28px max(4vw,16px) 10px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:28px;letter-spacing:-.03em}
h2{margin:0 0 12px;font-size:19px;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
main{padding:0 max(4vw,16px) 60px;display:grid;gap:18px}
section{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 1px 3px #0000000d}
.tools{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;color:inherit}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#b91c1c;border-color:#fecaca}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:14px;background:var(--bg)}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.off td{opacity:.4}
.flag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.flag.warn{background:#fff1f2;color:#be123c}
.flag.good{background:#f0fdf4;color:#15803d}
.funnel{display:grid;gap:6px}
.frow{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.fbar{height:22px;border-radius:6px;background:var(--bg);overflow:hidden}
.fbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.frow .n{text-align:right;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.screen{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;align-content:start}
.screen h3{margin:0;font-size:16px}
.screen .meta{color:var(--muted);font-size:13px}
.screen canvas{width:100%;max-width:300px;justify-self:center;aspect-ratio:402/874;border-radius:22px;background:#eceef2;box-shadow:0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.list{margin:0;padding:0;list-style:none;font-size:13px;display:grid;gap:3px}
.list li{display:flex;justify-content:space-between;gap:10px}
.list li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li b{font-variant-numeric:tabular-nums;flex:none}
.list.bad li span::before{content:"✕ ";color:var(--dead)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.confirm{display:none;gap:8px;align-items:center;font-size:14px}
.confirm.on{display:flex}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
.path{font-size:12px;color:var(--muted);white-space:normal;min-width:260px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
@media(max-width:600px){.frow{grid-template-columns:96px 1fr 70px}h1{font-size:23px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>사용 분석 리포트</h1>
    <p class="sub" id="sub">이 기기에 저장된 테스트 기록</p>
  </div>
  <div class="tools">
    <button id="exportJson">합치기용 파일 내보내기</button>
    <label class="btn">다른 기기 기록 가져오기<input id="importJson" type="file" accept="application/json,.json" multiple hidden></label>
    <button id="csvScreens">화면별 요약 CSV</button>
    <button id="csvClicks">클릭 원본 CSV</button>
    <button id="csvSessions">참여자별 CSV</button>
    <button class="danger" id="clear">기록 모두 지우기</button>
    <span class="confirm" id="confirm">정말 모두 지울까요? <button class="danger" id="clearYes">지우기</button><button id="clearNo">취소</button></span>
  </div>
</header>
<main id="main"></main>
<script src="report.js"></script>
</body>
</html>
